<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CronoPonto — Dashboard</title>
<meta name="description" content="CronoPonto — Cada minuto parado, no seu controle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- CDN Atualizado do Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#1c3a5e; --navy2:#274b74; --orange:#f2a93b; --bg:#eef1f5; --surface:#fff;
  --text:#1c2b3a; --muted:#7c8a99; --line:#e3e8ee; --good:#3fae6a; --bad:#c0392b;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-ui:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100%;}
.errbar{position:sticky;top:0;z-index:50;background:#fdecea;color:var(--bad);border-bottom:1px solid #f3c2bc;padding:9px 16px;font-size:.8rem;display:flex;justify-content:space-between;gap:10px;align-items:center;}
.errbar button{background:var(--bad);color:#fff;border:none;padding:4px 10px;border-radius:5px;font-size:.72rem;cursor:pointer;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:#fff;border-radius:14px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 12px 32px rgba(28,58,94,.15);}
.login-card .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.login-card h1{font-family:var(--font-display);font-size:1.3rem;margin:0;}
.login-card .tagline{display:block;font-size:.72rem;color:var(--muted);font-weight:500;margin-top:1px;}
.side .tagline{display:block;font-size:.66rem;color:#a9c0d6;margin-top:1px;letter-spacing:.02em;}
.login-card p{color:var(--muted);font-size:.85rem;margin:2px 0 18px;}
.perfil-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 4px;}
.perfil-opts button{border:1.5px solid var(--line);background:#fbfcfe;border-radius:8px;padding:10px 6px;font-family:var(--font-ui);font-size:.78rem;cursor:pointer;transition:.15s;}
.perfil-opts button.sel{border-color:var(--orange);background:#fff6e8;font-weight:600;}
.login-card select,.login-card input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;margin-top:6px;font-family:var(--font-ui);font-size:.9rem;}
.login-card label{font-size:.75rem;color:var(--muted);margin-top:14px;display:block;}
.login-btn{width:100%;margin-top:20px;background:var(--orange);color:#1c2b3a;border:none;padding:11px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.9rem;}
.login-err{color:var(--bad);font-size:.78rem;margin-top:8px;}
.login-note{font-size:.7rem;color:var(--muted);margin-top:16px;line-height:1.5;}

/* ---------- shell (gestor) ---------- */
.shell{display:flex;min-height:100vh;}
.side{width:230px;flex:none;background:var(--navy);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 20px;display:flex;flex-direction:column;gap:26px;}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12);}
.avatar{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;}
.profile .name{font-family:var(--font-display);font-weight:700;font-size:1rem;letter-spacing:.02em;}
.profile .mail{font-size:.7rem;color:#a9c0d6;}
.side nav{display:flex;flex-direction:column;gap:3px;}
.side nav button{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:none;color:#c3d4e6;padding:10px 12px;border-radius:8px;font-family:var(--font-ui);font-size:.88rem;cursor:pointer;transition:background .2s ease, color .2s ease, transform .15s ease;}
.side nav button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;transition:opacity .2s ease;}
.side nav button.active{background:var(--orange);color:#1c2b3a;font-weight:600;transform:translateX(2px);}
.side nav button.active .dot{opacity:1;}
.side nav button:hover:not(.active){color:#fff;background:rgba(255,255,255,.06);}
.side .foot{margin-top:auto;font-size:.68rem;color:#7f9ab6;line-height:1.5;}
.logout-onavy{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px;border-radius:7px;font-size:.75rem;cursor:pointer;margin-top:4px;font-weight:600;}
.logout-onavy:hover{background:rgba(255,255,255,.1);}
.logout-onlight{background:var(--navy);border:none;color:#fff;padding:8px 14px;border-radius:7px;font-size:.78rem;cursor:pointer;font-weight:600;}
.logout-onlight:hover{background:var(--navy2);}

.topbar{display:none;}
main{flex:1;min-width:0;padding:26px 34px calc(60px + env(safe-area-inset-bottom,0px));max-width:1700px;}
.headerbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;}
h1.page-title{font-family:var(--font-display);font-weight:600;font-size:1.4rem;margin:0 0 4px;}
.page-sub{color:var(--muted);font-size:.85rem;margin:0;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat{background:var(--surface);border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(28,58,94,.08);transition:transform .25s ease, box-shadow .25s ease;}
.stat:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(28,58,94,.12);}
.stat.hero{background:var(--navy);color:#fff;}
.stat .lbl{font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
.stat.hero .lbl{color:#a9c0d6;}
.stat .val{font-family:var(--font-mono);font-weight:500;font-size:1.5rem;margin-top:6px;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.card{background:var(--surface);border-radius:10px;padding:18px;box-shadow:0 1px 3px rgba(28,58,94,.08);margin-bottom:16px;transition:transform .25s ease, box-shadow .25s ease;}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(28,58,94,.1);}
.card h2{margin:0 0 12px;font-family:var(--font-display);font-weight:600;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;}
.card h2 .pct{background:var(--orange);color:#1c2b3a;font-family:var(--font-mono);font-size:.72rem;padding:2px 8px;border-radius:5px;}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--muted);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.doughnut-wrap{position:relative;height:150px;}
.doughnut-mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--font-mono);}
.doughnut-mid b{font-size:1.3rem;}
.doughnut-mid span{font-size:.65rem;color:var(--muted);}
ul.mini{list-style:none;margin:10px 0 0;padding:0;font-size:.78rem;}
ul.mini li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);}
ul.mini li:last-child{border-bottom:none;}
.chart-empty{font-size:.78rem;color:var(--muted);padding:30px 0;text-align:center;}

label{display:block;font-size:.74rem;color:var(--muted);margin-top:10px;}
input,select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fbfcfe;color:var(--text);font-family:var(--font-ui);font-size:.88rem;margin-top:3px;}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--orange);outline-offset:1px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.small{font-size:.74rem;color:var(--muted);}
.ptorow{display:grid;grid-template-columns:2fr auto;gap:8px;align-items:end;margin-top:8px;}
button.btn{margin-top:14px;background:var(--orange);color:#1c2b3a;border:none;padding:9px 16px;border-radius:6px;cursor:pointer;font-family:var(--font-ui);font-weight:600;font-size:.85rem;transition:transform .15s ease, box-shadow .15s ease;}
button.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(242,169,59,.35);}
button.btn.secondary{background:var(--navy);color:#fff;}
button.btn.secondary:hover{box-shadow:0 6px 14px rgba(28,58,94,.3);}
button.btn.small{padding:5px 10px;font-size:.72rem;margin-top:0;}
button.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none;}
table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:.8rem;margin-top:10px;}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);}
th{font-family:var(--font-ui);font-weight:600;color:var(--muted);font-size:.72rem;}
.wrap-x{overflow-x:auto;}
.tag{display:inline-block;background:var(--orange);color:#1c2b3a;border-radius:3px;padding:1px 8px;font-size:.7rem;margin-left:6px;font-family:var(--font-mono);}
.tag.ok{background:var(--good);color:#fff;}
.tag.pending{background:var(--line);color:var(--muted);}

/* ---------- motorista ---------- */
.driver-shell{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(60px + env(safe-area-inset-bottom,0px));}
.driver-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.driver-top .who{display:flex;align-items:center;gap:12px;}
.driver-top .who .av{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;}
.driver-top .who .txt b{display:block;font-family:var(--font-display);font-size:1rem;}
.driver-top .who .txt span{font-size:.72rem;color:var(--muted);}
.driver-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.driver-stats .s{background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 1px 3px rgba(28,58,94,.08);}
.driver-stats .s .l{font-size:.68rem;color:var(--muted);}
.driver-stats .s .v{font-family:var(--font-mono);font-weight:600;font-size:1.1rem;margin-top:2px;}
.rt-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.rt-tabs button{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:.78rem;font-family:var(--font-mono);cursor:pointer;}
.rt-tabs button.sel{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;}
.timeline{position:relative;padding-left:6px;}
.tl-item{position:relative;padding-left:28px;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:5px;top:22px;bottom:-2px;width:2px;background:var(--line);}
.tl-item:last-child::before{display:none;}
.tl-dot{position:absolute;left:0;top:2px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid #fff;box-shadow:0 0 0 2px var(--line);}
.tl-item.done .tl-dot{background:var(--good);box-shadow:0 0 0 2px var(--good);}
.tl-item.active .tl-dot{background:var(--orange);box-shadow:0 0 0 2px var(--orange);}
.tl-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px rgba(28,58,94,.08);}
.tl-item.active .tl-card{box-shadow:0 0 0 2px var(--orange);}
.tl-card .addr{font-weight:600;font-size:.92rem;}
.tl-card .times{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-family:var(--font-mono);font-size:.74rem;color:var(--muted);}
.tl-card .actions{display:flex;gap:8px;margin-top:10px;}
.driver-empty{text-align:center;padding:50px 20px;color:var(--muted);}

@media (max-width:900px){ .stats{grid-template-columns:repeat(2,1fr);} .grid2{grid-template-columns:1fr;} .driver-stats{grid-template-columns:1fr 1fr;} }
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeUp .35s ease both;}
@media (max-width:760px){
  .shell{flex-direction:column;}
  .side{display:none;}
  .topbar{display:flex;gap:4px;overflow-x:auto;background:var(--navy);padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;position:sticky;top:0;z-index:5;}
  .topbar button{white-space:nowrap;background:transparent;border:none;color:#c3d4e6;padding:7px 11px;border-radius:6px;font-family:var(--font-ui);font-size:.82rem;cursor:pointer;}
  .topbar button.active{background:var(--orange);color:#1c2b3a;}
  main{padding:18px 14px calc(50px + env(safe-area-inset-bottom,0px));}
  .row{grid-template-columns:1fr;}
}

/* ---------- refinamento visual: menu do gerente e tela do motorista ---------- */
.side{background:linear-gradient(180deg,#1c3a5e 0%,#162f4d 100%);box-shadow:2px 0 14px rgba(20,40,70,.18);}
.side .avatar{box-shadow:0 0 0 3px rgba(242,169,59,.9),0 6px 16px rgba(0,0,0,.25);}
.profile .name{font-size:1.1rem;letter-spacing:.04em;}
.profile .mail{background:rgba(255,255,255,.08);padding:3px 10px;border-radius:20px;text-transform:capitalize;}
.side nav{gap:5px;margin-top:4px;}
.side nav button{padding:11px 13px;font-size:.9rem;border-radius:10px;position:relative;}
.side nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
.side nav button.active{box-shadow:0 6px 14px rgba(242,169,59,.35);transform:none;}
.side nav button.active svg{opacity:1;}
.side nav button:hover:not(.active){transform:translateX(3px);}
.logout-onavy{padding:10px;border-radius:10px;letter-spacing:.03em;}
.logout-onavy:hover{background:var(--orange);border-color:var(--orange);color:#1c2b3a;}
.topbar button{display:inline-flex;align-items:center;gap:6px;}
.topbar button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

body:has(.driver-shell){background:linear-gradient(180deg,#1c3a5e 0,#1c3a5e 190px,var(--bg) 190px);}
.driver-shell{padding-top:calc(16px + env(safe-area-inset-top,0px));}
.driver-top{margin-bottom:22px;}
.driver-top .who .av{width:48px;height:48px;background:var(--orange);color:#1c2b3a;box-shadow:0 0 0 3px rgba(255,255,255,.25);}
.driver-top .who .txt b{color:#fff;font-size:1.1rem;}
.driver-top .who .txt span{color:#a9c0d6;}
.logout-onlight{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:7px 16px;}
.logout-onlight:hover{background:var(--orange);border-color:var(--orange);color:#1c2b3a;}
.driver-stats{gap:12px;margin-bottom:20px;}
.driver-stats .s{border-radius:14px;padding:12px 14px;box-shadow:0 8px 20px rgba(28,58,94,.14);border-top:3px solid var(--line);}
.driver-stats .s:nth-child(1){border-top-color:var(--navy);}
.driver-stats .s:nth-child(2){border-top-color:var(--orange);}
.driver-stats .s:nth-child(3){border-top-color:var(--good);}
.driver-stats .s .l{text-transform:uppercase;letter-spacing:.06em;font-size:.62rem;font-weight:600;}
.driver-stats .s .v{font-size:1.25rem;color:var(--navy);}
.rt-tabs{gap:8px;padding:2px 2px 6px;}
.rt-tabs button{border-radius:12px;padding:8px 14px;box-shadow:0 1px 3px rgba(28,58,94,.08);}
.rt-tabs button.sel{background:var(--orange);border-color:var(--orange);color:#1c2b3a;box-shadow:0 5px 12px rgba(242,169,59,.4);}
.driver-shell .card{border-radius:16px;box-shadow:0 8px 22px rgba(28,58,94,.1);padding:20px;}
.timeline{padding-left:0;}
.tl-item{padding-left:34px;padding-bottom:14px;}
.tl-item::before{left:8px;top:26px;width:3px;border-radius:2px;}
.tl-item.done::before{background:var(--good);}
.tl-dot{width:18px;height:18px;left:0;top:10px;border:3px solid #fff;}
.tl-card{border:1px solid var(--line);box-shadow:none;border-radius:12px;padding:14px 16px;background:#fbfcfe;}
.tl-item.done .tl-card{background:#f3faf6;border-color:#cfe9da;}
.tl-item.active .tl-card{background:#fff;border-color:var(--orange);box-shadow:0 6px 18px rgba(242,169,59,.25);}
.tl-card .addr{font-family:var(--font-display);font-size:1rem;}
.tl-card .actions{gap:10px;margin-top:12px;}
.tl-card .actions .btn{flex:1;padding:12px 10px;font-size:.85rem;border-radius:10px;font-weight:700;}
.tl-card .actions .btn:disabled{opacity:.35;}
.tl-item.active .actions .btn:not(.secondary):not(:disabled){box-shadow:0 6px 14px rgba(242,169,59,.4);}
@media (max-width:900px){ .driver-stats{grid-template-columns:repeat(3,1fr);gap:8px;} .driver-stats .s{padding:10px 10px;} .driver-stats .s .l{font-size:.55rem;} .driver-stats .s .v{font-size:.95rem;} }
body:has(.driver-shell){background:linear-gradient(180deg,#1c3a5e 0,#1c3a5e 200px,var(--bg) 200px);}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px;}
.steps span{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);background:#f3f5f8;border-radius:20px;padding:5px 12px 5px 6px;}
.steps span b{width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;}
.steps span.cur{background:#fff6e8;color:var(--text);font-weight:600;box-shadow:0 0 0 1.5px var(--orange);}
.steps span.cur b{background:var(--orange);color:#1c2b3a;}
.steps span.done b{background:var(--good);color:#fff;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px;}
.chips span{background:#f3f5f8;border-radius:10px;padding:7px 12px;font-size:.88rem;font-weight:600;}
.chips span i{display:block;font-style:normal;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;}
.chips span.lock{background:transparent;color:var(--muted);font-size:.74rem;font-weight:500;align-self:center;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.btnrow .btn{margin-top:0;}
button.btn:disabled{opacity:.45;cursor:not-allowed;}

.filtro-periodo{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:16px;}
.filtro-periodo .fp-field{display:flex;flex-direction:column;gap:4px;}
.filtro-periodo label{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;}
.filtro-periodo input, .filtro-periodo select{border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;font-family:var(--font-ui);font-size:.82rem;}
.filtro-periodo .fp-info{font-size:.78rem;color:var(--muted);margin-left:auto;align-self:center;}
.expand-row{cursor:pointer;}
.expand-row:hover{background:#f7f9fc;}
.expand-row .car{display:inline-block;transition:transform .18s;margin-right:6px;color:var(--muted);}
.expand-row.open .car{transform:rotate(90deg);}
.sub-table{background:#f8fafc;border-radius:10px;margin:4px 0 10px;padding:8px 10px;}
.sub-table table{margin-top:0;}
.sub-table th{color:var(--muted);}
</style>
</head>
<body>
<div id="err"></div>
<div id="root"></div>

<script>
const API = "http://localhost:3001/api";
console.log("CronoPonto UI v3 (graficos com tooltip e legenda)");
function showError(msg){
  document.getElementById("err").innerHTML =
    `<div class="errbar"><span>⚠ ${msg}</span><button onclick="document.getElementById('err').innerHTML=''">fechar</button></div>`;
}
function clearError(){ document.getElementById("err").innerHTML = ""; }
async function api(path, opts){
  let r;
  try{ r = await fetch(API+path, opts); }
  catch(e){ throw new Error("não consegui alcançar "+API+" — confira se o `npm start` do backend está rodando"); }
  if(!r.ok){ const e = await r.json().catch(()=>({erro:r.statusText})); throw new Error(e.erro||"erro na API"); }
  return r.json();
}
function pad2(n){ return String(n).padStart(2,"0"); }
function hojeISO(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function nowISO(){ const d=new Date(); return hojeISO()+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function guarded(fn){
  return async function(...args){
    try{ clearError(); await fn(...args); }
    catch(e){ console.error(e); showError(e.message || "ocorreu um erro inesperado"); }
  };
}

let session = null;

function animateStatValues(){
  document.querySelectorAll(".stat .val, .doughnut-mid b").forEach(el=>{
    const txt = el.textContent.trim(); const m = txt.match(/^([^\d]*)([\d.]+)(.*)$/); if(!m) return;
    const [,prefix,numStr,suffix] = m; const target = parseFloat(numStr.replace(",", "."));
    if(isNaN(target)) return;
    const decimals = numStr.includes(".") ? numStr.split(".")[1].length : 0;
    let start = null; const dur = 650;
    function step(ts){ if(!start) start=ts; const p=Math.min((ts-start)/dur,1); const eased=1-Math.pow(1-p,3);
      el.textContent = prefix+(target*eased).toFixed(decimals)+suffix; if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  });
}

    <div class="small">1º ponto adicionado = partida (RN01). Chegada/saída são registradas pelo próprio motorista, no login dele.</div>
    <div class="wrap-x"><table><tr><th>Ordem</th><th>Ponto</th><th></th></tr>
    ${currentPontos.map((cp,i)=>`<tr><td>${i+1}</td><td>${nomePonto(cp.pontoId)}${i===0?' <span class="small">(partida)</span>':''}</td><td>${i===currentPontos.length-1?`<button class="btn small secondary" onclick="removerUltimoPonto()">remover</button>`:""}</td></tr>`).join("") || "<tr><td colspan=3 class='small'>Nenhum ponto adicionado.</td></tr>"}
    </table></div>
    <div class="btnrow">
      <button class="btn" onclick="salvarRoteiro()" ${currentPontos.length<2?"disabled":""}>Terminar roteiro</button>
      <button class="btn secondary" onclick="cancelarRoteiro()">Cancelar roteiro</button>
    </div>
    ${currentPontos.length<2?'<div class="small">Adicione ao menos 2 pontos (partida + 1) para terminar.</div>':""}
  </div>` + registrados;
}
function nomePonto(id){ const p=cache.pontos.find(x=>x.id==id); return p?esc(p.endereco):"?"; }
function nomeMotorista(id){ const m=cache.motoristas.find(x=>x.id==id); return m?m.nome:"?"; }
function iniciarRoteiro(){
  const mot = Number(r_mot.value), data = r_data.value, dist = parseFloat(r_dist.value);
  if(!mot){ showError("Cadastre um motorista antes de montar um roteiro."); return; }
  if(!data){ showError("Informe a data do roteiro."); return; }
  if(!(dist>0)){ showError("Informe a distância total do percurso (km)."); return; }
  clearError();
  draft = { motoristaId:mot, data, dist };
  currentPontos = [];
  renderTab();
}
function addPontoRoteiro(){ currentPontos.push({pontoId:add_pto.value}); renderTab(); }
function removerUltimoPonto(){ currentPontos.pop(); renderTab(); }
function cancelarRoteiro(){ draft = null; currentPontos = []; renderTab(); }
const salvarRoteiro = guarded(async function(){
  if(!draft) return;
  if(currentPontos.length<2){ showError("Adicione ao menos 2 pontos (partida + 1)."); return; }
  const pontos = currentPontos.map((cp,i)=>({ordem:i+1, pontoId:Number(cp.pontoId)}));
  await api("/roteiros",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    data:draft.data, motoristaId:draft.motoristaId, distanciaTotalKm:draft.dist, pontos})});
  draft=null; currentPontos=[]; await loadAll(); renderTab();
});

function renderParametros(){
  const p=cache.param;
  return `<div class="card"><h2>Custo e jornada</h2>
    <label>Valor do combustível (R$/litro)</label><input id="pp_comb" type="number" step="0.01" value="${p.valorCombustivel}">
    <label>Custo por km percorrido (R$) — referência alternativa</label><input id="pp_km" type="number" step="0.01" value="${p.custoPorKm}">
    <label>Jornada padrão (horas/dia)</label><input id="pp_jor" type="number" step="0.5" value="${p.jornadaPadraoHoras}">
    <button class="btn" onclick="salvarParam()">Salvar parâmetros</button>
    <div class="small" style="margin-top:8px">RN07: custo do roteiro = (distância ÷ km/litro do veículo) × valor do combustível.</div>
  </div>`;
}
const salvarParam = guarded(async function(){
  await api("/parametros",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    valorCombustivel:parseFloat(pp_comb.value)||cache.param.valorCombustivel,
    custoPorKm:parseFloat(pp_km.value)||cache.param.custoPorKm,
    jornadaPadraoHoras:parseFloat(pp_jor.value)||cache.param.jornadaPadraoHoras})});
  await loadAll(); renderTab();
});

let dashFiltro = { de:"", ate:"", agrupar:"dia" };
function setDashAgrupar(v){ dashFiltro.agrupar=v; renderTab(); }
function aplicarPeriodoDash(){ dashFiltro.de=dash_de.value; dashFiltro.ate=dash_ate.value; renderTab(); }
function limparPeriodoDash(){ dashFiltro={de:"",ate:"",agrupar:dashFiltro.agrupar}; renderTab(); }
function roteirosNoPeriodo(){
  return cache.roteiros.filter(r => (!dashFiltro.de||r.data>=dashFiltro.de) && (!dashFiltro.ate||r.data<=dashFiltro.ate));
}
function renderDashboard(){
  const rp = roteirosNoPeriodo();
  const totalJornadaMin = cache.param.jornadaPadraoHoras*60;
  const tempoTotal = rp.reduce((s,r)=>s+r.tempoTotalParadoMin,0);
  const pct = rp.length? Math.round(100*(tempoTotal/rp.length)/totalJornadaMin) : 0;
  const rotulo = dashFiltro.agrupar==="mes" ? "por mês" : "por dia";
  return `
  <div class="card filtro-periodo">
    <div class="fp-field"><label>De</label><input id="dash_de" type="date" value="${dashFiltro.de}"></div>
    <div class="fp-field"><label>Até</label><input id="dash_ate" type="date" value="${dashFiltro.ate}"></div>
    <button class="btn secondary" onclick="aplicarPeriodoDash()">Filtrar período</button>
    <button class="btn secondary" onclick="limparPeriodoDash()">Limpar</button>
    <div class="rt-tabs" style="margin:0;">
      <button class="${dashFiltro.agrupar==='dia'?'sel':''}" onclick="setDashAgrupar('dia')">Agrupar por dia</button>
      <button class="${dashFiltro.agrupar==='mes'?'sel':''}" onclick="setDashAgrupar('mes')">Agrupar por mês</button>
    </div>
    <div class="fp-info">${rp.length} roteiro(s) no período · ${tempoTotal} min parados</div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Tempo parado ${rotulo} <span class="pct">min</span></h2>
      <div style="position:relative;height:220px;"><canvas id="chBar"></canvas></div>
    </div>
    <div class="card"><h2>Tempo parado por Motorista</h2>
      <div style="position:relative;height:220px;"><canvas id="chMot"></canvas></div>
    </div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Ocupação da jornada média</h2>
      <div class="doughnut-wrap"><canvas id="chDonut"></canvas><div class="doughnut-mid"><b>${pct}%</b><span>parado / jornada</span></div></div>
      <div class="legend" style="justify-content:center;margin:10px 0 6px;"><span><i style="background:var(--navy)"></i>tempo parado médio</span><span><i style="background:#e3e8ee"></i>resto da jornada</span></div>
      <ul class="mini">
        <li><span>Jornada padrão</span><b>${cache.param.jornadaPadraoHoras} h</b></li>
        <li><span>Combustível</span><b>R$ ${cache.param.valorCombustivel.toFixed(2)}</b></li>
        <li><span>Custo por km</span><b>R$ ${cache.param.custoPorKm.toFixed(2)}</b></li>
      </ul>
    </div>
    <div class="card"><h2>Tendência de custo por roteiro</h2>
      <div style="position:relative;height:250px;"><canvas id="chLine"></canvas></div>
    </div>
  </div>`;
}

function buildCharts(){
  if(active!=="dashboard") return;
  ["chBar","chMot","chDonut","chLine"].forEach(id=>{ const c=document.getElementById(id); const inst=c&&Chart.getChart&&Chart.getChart(c); if(inst) inst.destroy(); });
  if(typeof Chart === "undefined"){
    ["chBar","chDonut","chLine","chMot"].forEach(id=>{ const el=document.getElementById(id);
      if(el) el.insertAdjacentHTML("afterend","<div class='chart-empty'>Não foi possível carregar o Chart.js. Verifique a conexão e recarregue.</div>"); });
    return;
  }
  
  // Limpeza de segurança extra antes de desenhar
  Object.keys(charts).forEach(k => {
    try { if (charts[k]) charts[k].destroy(); } catch (e) {}
  });
  charts = {};

  const rp = roteirosNoPeriodo();
  const ordenados = [...rp].sort((a,b)=>a.data.localeCompare(b.data));
  const porGrupo = {};
  ordenados.forEach(r=>{
    const chave = dashFiltro.agrupar==="mes" ? r.data.slice(0,7) : r.data;
    porGrupo[chave] = (porGrupo[chave]||0) + r.tempoTotalParadoMin;
  });
  const chavesOrdenadas = Object.keys(porGrupo).sort();
  const diasBar = chavesOrdenadas.map(k => dashFiltro.agrupar==="mes" ? k.slice(5)+"/"+k.slice(0,4) : k.slice(5));
  const temposBar = chavesOrdenadas.map(k => porGrupo[k]);
  const dias = ordenados.map(r=>r.data.slice(5)+" #"+r.id);
  const custos = ordenados.map(r=>r.custoEstimado);
  const dist = ordenados.map(r=>r.distanciaTotalKm);
  const navy = '#1c3a5e', orange = '#f2a93b';
  
  const tip = { enabled:true, backgroundColor:'#1c3a5e', padding:10, titleColor:'#fff', bodyColor:'#fff', displayColors:true };
  const leg = { display:true, position:'bottom', labels:{ usePointStyle:true, boxWidth:8, padding:14, font:{size:11} } };

  const barEl = document.getElementById('chBar');
  if(barEl) charts.bar = new Chart(barEl, {type:'bar',
    data:{labels:diasBar.length?diasBar:['-'], datasets:[{label:'Tempo parado (min)', data:temposBar.length?temposBar:[0], backgroundColor:orange, borderRadius:4, maxBarThickness:34, hoverBackgroundColor:navy}]},
    options:{maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:leg, tooltip:{...tip, callbacks:{label:c=>' '+c.parsed.y+' min'}}}, scales:{y:{beginAtZero:true,grid:{color:'#eef1f5'}}, x:{grid:{display:false}}}}
  });

  const totalJornadaMin = cache.param.jornadaPadraoHoras*60;
  const tempoTotal = rp.reduce((s,r)=>s+r.tempoTotalParadoMin,0);
  const media = rp.length? tempoTotal/rp.length : 0;
  const donutEl = document.getElementById('chDonut');
  if(donutEl) charts.donut = new Chart(donutEl, {type:'doughnut',
    data:{labels:['Tempo parado médio','Resto da jornada'], datasets:[{data:[Math.round(media), Math.max(Math.round(totalJornadaMin-media),0)], backgroundColor:[navy, '#e3e8ee'], borderWidth:0, hoverOffset:6}]},
    options:{cutout:'72%', maintainAspectRatio:false, animation:{animateRotate:true, animateScale:true, duration:1000, easing:'easeOutCubic'},
      plugins:{legend:{display:false}, tooltip:{...tip, callbacks:{label:c=>' '+c.label+': '+c.parsed+' min'}}}}
  });

  const lineEl = document.getElementById('chLine');
  if(lineEl) charts.line = new Chart(lineEl, {type:'line',
    data:{labels:dias.length?dias:['-'], datasets:[
      {label:'Custo estimado (R$)', data:custos.length?custos:[0], borderColor:navy, backgroundColor:'rgba(28,58,94,.12)', fill:true, tension:.4, pointRadius:4, pointHoverRadius:7, pointHitRadius:12},
      {label:'Distância (km)', data:dist.length?dist:[0], borderColor:orange, backgroundColor:'rgba(242,169,59,.15)', fill:true, tension:.4, pointRadius:4, pointHoverRadius:7, pointHitRadius:12}
    ]},
    options:{maintainAspectRatio:false, animation:{duration:1100,easing:'easeOutQuart'}, interaction:{intersect:false,mode:'index'},
      plugins:{legend:leg, tooltip:{...tip, callbacks:{label:c=>' '+c.dataset.label+': '+(c.datasetIndex===0?'R$ '+c.parsed.y.toFixed(2):c.parsed.y+' km')}}}, scales:{y:{grid:{color:'#eef1f5'}}, x:{grid:{display:false}}}}
  });

  // GRÁFICO: Tempo Parado por Motorista
  const motEl = document.getElementById('chMot');
  if(motEl) {
    const aggMot = {};
    rp.forEach(r => {
      const mNome = nomeMotorista(r.motoristaId) || 'Desconhecido';
      aggMot[mNome] = (aggMot[mNome] || 0) + r.tempoTotalParadoMin;
    });
    const labelsMot = Object.keys(aggMot);
    const dataMot = Object.values(aggMot);
    charts.mot = new Chart(motEl, {
      type: 'bar',
      data: {
        labels: labelsMot.length ? labelsMot : ['-'],
        datasets: [{
          label: 'Minutos acumulados',
          data: dataMot.length ? dataMot : [0],
          backgroundColor: navy,
          borderRadius: 4,
          maxBarThickness: 34,
          hoverBackgroundColor: orange
        }]
      },
      options: {
        indexAxis: 'y', // Inverte para barras horizontais
        maintainAspectRatio: false,
        interaction: { mode: 'nearest', axis: 'y', intersect: false },
        plugins: { legend: leg, tooltip: { ...tip, callbacks: { label: c => ' ' + c.parsed.x + ' min' } } },
        scales: { 
          x: { beginAtZero: true, grid: { color: '#eef1f5' } }, 
          y: { grid: { display: false } } 
        }
      }
    });
  }
}

boot();
</script>
</body>
</html>
